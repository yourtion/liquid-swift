name: Swift

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift test --parallel
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Build server-rendered example
        if: matrix.swift == 'latest'
        run: swift build --package-path Examples/ServerRender
      - name: Smoke test real HTTP responses
        if: matrix.swift == 'latest'
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          python3 Examples/ServerRender/smoke_test.py
      - name: Install official compatibility harness dependencies
        if: matrix.swift == 'latest'
        run: |
          apt-get install -y -qq ruby ruby-dev ruby-bundler build-essential
          gem install bundler --version 2.6.7 --no-document
          BUNDLE_GEMFILE=Compatibility/Gemfile BUNDLE_PATH=.build/compatibility-gems BUNDLE_FROZEN=true bundle install
      - name: Run official Liquid compatibility regression gate
        if: matrix.swift == 'latest'
        env:
          BUNDLE_PATH: .build/compatibility-gems
          BUNDLE_FROZEN: 'true'
        run: bash Compatibility/run.sh
      - name: Upload official compatibility results
        if: always() && matrix.swift == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: liquid-spec-linux
          path: .build/compatibility/results.json
          if-no-files-found: ignore

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install the official Swift 6.4.1 toolchain
        run: |
          swift_pkg="$RUNNER_TEMP/swift-6.4.1.pkg"
          curl --fail --location --retry 3 \
            https://download.swift.org/swift-6.4.1-release/xcode/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-osx.pkg \
            --output "$swift_pkg"
          pkgutil --check-signature "$swift_pkg"
          sudo installer -pkg "$swift_pkg" -target /
          swift_bin=/Library/Developer/Toolchains/swift-6.4.1-RELEASE.xctoolchain/usr/bin
          test -x "$swift_bin/swift"
          echo "$swift_bin" >> "$GITHUB_PATH"
      - run: swift --version
      - run: swift test --parallel
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Build server-rendered example
        run: swift build --package-path Examples/ServerRender
      - name: Smoke test real HTTP responses
        run: python3 Examples/ServerRender/smoke_test.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.7'
      - name: Install official compatibility harness dependencies
        run: BUNDLE_GEMFILE=Compatibility/Gemfile BUNDLE_PATH=.build/compatibility-gems BUNDLE_FROZEN=true bundle install
      - name: Run official Liquid compatibility regression gate
        env:
          BUNDLE_PATH: .build/compatibility-gems
          BUNDLE_FROZEN: 'true'
        run: bash Compatibility/run.sh
      - name: Upload official compatibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: liquid-spec-macos
          path: .build/compatibility/results.json
          if-no-files-found: ignore
